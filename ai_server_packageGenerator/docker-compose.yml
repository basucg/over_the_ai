services:
  ollama:
    image: ollama/ollama:latest
    container_name: swu_slm_ollama
    command: serve

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      HTTP_PROXY: "http://host.docker.internal:3129"
      HTTPS_PROXY: "http://host.docker.internal:3129"
      http_proxy: "http://host.docker.internal:3129"
      https_proxy: "http://host.docker.internal:3129"
      NO_PROXY: "localhost,127.0.0.1,ollama,swu_slm_ollama"
      no_proxy: "localhost,127.0.0.1,ollama,swu_slm_ollama"

    ports:
      - "11434:11434"

    volumes:
      - ollama_models:/root/.ollama

    networks:
      - swu_net

    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    restart: unless-stopped

  ollama_model_init:
    image: ollama/ollama:latest
    container_name: swu_slm_model_init

    entrypoint:
      - /bin/sh
      - -c
      - ollama pull $${SLM_MODEL:-gemma3:4b}

    environment:
      SLM_MODEL: "gemma3:4b"
      OLLAMA_HOST: "http://ollama:11434"
      HTTP_PROXY: "http://host.docker.internal:3129"
      HTTPS_PROXY: "http://host.docker.internal:3129"
      http_proxy: "http://host.docker.internal:3129"
      https_proxy: "http://host.docker.internal:3129"
      NO_PROXY: "localhost,127.0.0.1,ollama,swu_slm_ollama"
      no_proxy: "localhost,127.0.0.1,ollama,swu_slm_ollama"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - swu_net

    depends_on:
      ollama:
        condition: service_healthy

    restart: "no"

  ai_diagnostic_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ai_server
        HTTP_PROXY: "http://host.docker.internal:3129"
        HTTPS_PROXY: "http://host.docker.internal:3129"
        http_proxy: "http://host.docker.internal:3129"
        https_proxy: "http://host.docker.internal:3129"
        NO_PROXY: "localhost,127.0.0.1,ollama,swu_slm_ollama"
        no_proxy: "localhost,127.0.0.1,ollama,swu_slm_ollama"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    container_name: swu_ai_server

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "9000:9000"

    environment:
      AI_SERVER_HOST: "0.0.0.0"
      AI_SERVER_PORT: "9000"
      SLM_API_URL: "http://ollama:11434/api/generate"
      SLM_MODEL: "gemma3:4b"
      SLM_TIMEOUT_SEC: "600"
      PKG_GEN_HOST: "swu_package_generator"
      PKG_GEN_PORT: "9001"

      NO_PROXY: "localhost,127.0.0.1,ollama,swu_slm_ollama"
      no_proxy: "localhost,127.0.0.1,ollama,swu_slm_ollama"

    networks:
      - swu_net

    depends_on:
      ollama:
        condition: service_healthy
      ollama_model_init:
        condition: service_completed_successfully

    restart: unless-stopped

  swu_package_generator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: pkg_gen
    container_name: swu_package_generator
    ports:
      - "9001:9001"
    networks:
      - swu_net
    environment:
      PKG_GEN_HOST: "0.0.0.0"
      PKG_GEN_PORT: "9001"
    restart: unless-stopped

networks:
  swu_net:
    driver: bridge

volumes:
  ollama_models: